<svg xmlns="http://www.w3.org/2000/svg" width="305" height="270" viewBox="55 8 305 270">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#174B52"/>
      <stop offset="1" stop-color="#286A6B"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A94B20"/>
      <stop offset="1" stop-color="#D56B27"/>
    </linearGradient>
    <linearGradient id="goldbook" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C87913"/>
      <stop offset="1" stop-color="#E0921C"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17313A" flood-opacity=".20"/>
    </filter>
  </defs>

  <!-- subtle ground shadow -->
  <ellipse cx="211" cy="267" rx="145" ry="9" fill="#17313A" opacity=".10"/>

  <!-- left teal book -->
  <g filter="url(#shadow)">
    <rect x="72" y="64" width="47" height="194" rx="5" fill="url(#teal)"/>
    <rect x="76" y="67" width="5" height="188" rx="2" fill="#123D44" opacity=".7"/>
    <rect x="75" y="87" width="40" height="4" rx="2" fill="#D39A31"/>
    <rect x="75" y="238" width="40" height="5" rx="2" fill="#D39A31"/>
  </g>

  <!-- orange/brown book -->
  <g filter="url(#shadow)">
    <rect x="121" y="39" width="54" height="219" rx="5" fill="url(#orange)"/>
    <rect x="126" y="42" width="5" height="212" rx="2" fill="#8E3C1B" opacity=".7"/>
    <rect x="124" y="60" width="47" height="5" rx="2" fill="#E3A047"/>
    <rect x="124" y="238" width="47" height="5" rx="2" fill="#E3A047"/>
  </g>

  <!-- central film reel / film strip -->
  <g filter="url(#shadow)">
    <rect x="178" y="20" width="70" height="238" rx="5" fill="#183D4A"/>
    <rect x="184" y="26" width="58" height="226" rx="2" fill="#214D59"/>
    <!-- film sprocket holes -->
    <g fill="#F5F3ED">
      <rect x="190" y="34" width="12" height="18" rx="2"/>
      <rect x="230" y="34" width="12" height="18" rx="2"/>
      <rect x="190" y="65" width="12" height="18" rx="2"/>
      <rect x="230" y="65" width="12" height="18" rx="2"/>
      <rect x="190" y="96" width="12" height="18" rx="2"/>
      <rect x="230" y="96" width="12" height="18" rx="2"/>
      <rect x="190" y="127" width="12" height="18" rx="2"/>
      <rect x="230" y="127" width="12" height="18" rx="2"/>
      <rect x="190" y="158" width="12" height="18" rx="2"/>
      <rect x="230" y="158" width="12" height="18" rx="2"/>
      <rect x="190" y="189" width="12" height="18" rx="2"/>
      <rect x="230" y="189" width="12" height="18" rx="2"/>
      <rect x="190" y="220" width="12" height="18" rx="2"/>
      <rect x="230" y="220" width="12" height="18" rx="2"/>
    </g>
  </g>

  <!-- right golden/orange book -->
  <g filter="url(#shadow)">
    <rect x="254" y="58" width="48" height="200" rx="5" fill="url(#goldbook)"/>
    <rect x="258" y="62" width="5" height="192" rx="2" fill="#A45F13" opacity=".65"/>
    <rect x="257" y="80" width="41" height="4" rx="2" fill="#F0B34B"/>
    <rect x="257" y="238" width="41" height="5" rx="2" fill="#F0B34B"/>
  </g>

  <!-- far-right tilted teal book -->
  <g transform="rotate(-10 323 164)" filter="url(#shadow)">
    <rect x="306" y="64" width="43" height="194" rx="5" fill="url(#teal)"/>
    <rect x="310" y="68" width="5" height="186" rx="2" fill="#123D44" opacity=".65"/>
    <rect x="309" y="87" width="37" height="4" rx="2" fill="#D39A31"/>
    <rect x="309" y="238" width="37" height="5" rx="2" fill="#D39A31"/>
  </g>
</svg>
